name: "MyKafka UI: CI"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # https://github.com/actions/checkout/releases/tag/v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # https://github.com/actions/setup-java/releases/tag/v4.7.1
        with:
          java-version-file: '.java-version'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Run backend tests
        run: ./gradlew :api:test --stacktrace

      - name: Upload backend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        with:
          name: backend-test-reports-${{ github.run_attempt }}
          path: |
            api/build/reports/tests/test/
            api/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

  frontend-tests:
    name: Frontend checks
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # https://github.com/actions/checkout/releases/tag/v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # https://github.com/pnpm/action-setup/releases/tag/v4.2.0
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # https://github.com/actions/setup-node/releases/tag/v4.4.0
        with:
          node-version: "22.13.0"
          cache: "pnpm"
          cache-dependency-path: "./frontend/pnpm-lock.yaml"

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Compile frontend
        run: |
          cd frontend
          pnpm compile

      - name: Lint frontend
        run: |
          cd frontend
          pnpm eslint --quiet --ext .tsx,.ts src/

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm test:CI

  package-jar:
    name: Package application JAR
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # https://github.com/actions/checkout/releases/tag/v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # https://github.com/actions/setup-java/releases/tag/v4.7.1
        with:
          java-version-file: '.java-version'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="mykafka-v0.1.${GITHUB_RUN_NUMBER}"
            release_tag="$version"
          else
            version="mykafka-ci-${GITHUB_SHA::7}"
            release_tag=""
          fi

          asset_name="mykafka-ui-${version#mykafka-}.jar"
          display_version="${version#mykafka-}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "display_version=$display_version" >> "$GITHUB_OUTPUT"

      - name: Package JAR with frontend
        shell: bash
        run: |
          ./gradlew :api:bootJar --no-daemon \
            -Pinclude-frontend=true \
            -Pversion=${{ steps.meta.outputs.version }}
          mkdir -p dist
          cp "api/build/libs/api-${{ steps.meta.outputs.version }}.jar" \
            "dist/${{ steps.meta.outputs.asset_name }}"

      - name: Upload packaged JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        with:
          name: mykafka-ui-${{ steps.meta.outputs.version }}
          path: dist/${{ steps.meta.outputs.asset_name }}
          retention-days: 30

      - name: Publish MyKafka UI release
        if: ${{ steps.meta.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          DISPLAY_VERSION: ${{ steps.meta.outputs.display_version }}
        shell: bash
        run: |
          previous_tag="$(git tag --merged "$GITHUB_SHA" --sort=-creatordate | grep -E '^(mykafka-v|custom-v)' | grep -vx "$RELEASE_TAG" | head -n 1 || true)"

          {
            echo "# MyKafka UI - $DISPLAY_VERSION"
            echo
            echo "Automated release from a successful main branch build."
            echo
            echo "## Build"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_NUMBER\`"
            echo "- JAR: \`$ASSET_NAME\`"
            echo
            echo "## Changelog"
            if [[ -n "$previous_tag" ]]; then
              echo "Changes since \`$previous_tag\`:"
              echo
              git log --no-merges --format='- %s (%h)' "$previous_tag..$GITHUB_SHA"
            else
              echo "Initial MyKafka UI release."
              echo
              git log --no-merges --format='- %s (%h)' "$GITHUB_SHA"
            fi
          } > release-notes.md

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MyKafka UI - $DISPLAY_VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MyKafka UI - $DISPLAY_VERSION" \
              --notes-file release-notes.md
          fi

      - name: Verify release JAR
        if: ${{ steps.meta.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | grep -Fx "$ASSET_NAME"
