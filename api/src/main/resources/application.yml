auth:
  type: DISABLED

server:
  netty:
    max-initial-line-length: 64KB
  compression:
    enabled: ${KAFBAT_UI_HTTP_COMPRESSION_ENABLED:true}
    min-response-size: 2KB
    # text/event-stream is intentionally excluded so SSE message streams are flushed immediately.
    mime-types: application/json,application/x-ndjson,application/javascript,text/javascript,text/html,text/css,text/plain,text/csv,image/svg+xml,application/yaml

spring:
  codec:
    max-in-memory-size: ${KAFBAT_UI_CODEC_MAX_IN_MEMORY_SIZE:16MB}
  webflux:
    multipart:
      max-in-memory-size: ${KAFBAT_UI_MULTIPART_MAX_IN_MEMORY_SIZE:10MB}

management:
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "info,health,prometheus"

springdoc:
  path: /swagger
  api-docs:
    enabled: ${SWAGGER_UI_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
    url: /openapi/mykafka-ui-api.yaml
    urls:
      - name: mykafka-ui
        url: /openapi/mykafka-ui-api.yaml
    config-url: null
  override-with-generic-response: true

logging:
  level:
    root: INFO
    io.kafbat.ui: ${KAFBAT_UI_LOG_LEVEL:INFO}
    reactor.netty.http.server.AccessLog: INFO
    org.hibernate.validator: WARN
